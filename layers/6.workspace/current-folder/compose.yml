# Workspace dossier courant — Monte le dossier de travail local
services:
  workspace:
    image: ubuntu:24.04
    container_name: kanissa-workspace
    restart: unless-stopped
    command: ["sleep", "infinity"]
    volumes:
      - "${KANISSA_WORKSPACE_DIR:-.}:/workspace"
    working_dir: /workspace
    networks:
      - kanissa

networks:
  kanissa:
    external: true
