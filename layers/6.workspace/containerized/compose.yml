# Workspace conteneurisé — Claude Code AI Agent avec MCP, Tools et LLM Proxy
services:
  workspace:
    build:
      context: .
    container_name: kanissa-workspace
    restart: unless-stopped
    ports:
      - "${WORKSPACE_SSH_PORT:-7727}:22"
    volumes:
      - "${KANISSA_DATA:-.data}/workspace:/workspace"
      - "${KANISSA_DATA:-.data}/claude-code:/root/.claude"
      - "${KANISSA_DATA:-.data}/ssh:/etc/kanissa-ssh:ro"
    working_dir: /workspace
    environment:
      # ── API & Proxy LLM ──────────────────────────────────────────────────
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      # ── Google Vertex AI ─────────────────────────────────────────────────
      - CLAUDE_CODE_USE_VERTEX=${CLAUDE_CODE_USE_VERTEX:-0}
      - CLOUD_ML_REGION=${CLOUD_ML_REGION:-}
      - ANTHROPIC_VERTEX_PROJECT_ID=${ANTHROPIC_VERTEX_PROJECT_ID:-}
      # ── MCP Gitlab ───────────────────────────────────────────────────────
      - GITLAB_PERSONAL_ACCESS_TOKEN=${GITLAB_TOKEN:-}
      - GITLAB_API_URL=${GITLAB_API_URL:-https://gitlab.com/api/v4}
      # ── MCP AWS ──────────────────────────────────────────────────────────
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-eu-west-1}
      # ── MCP Terraform ───────────────────────────────────────────────────
      - TF_TOKEN=${TERRAFORM_TOKEN:-}
      # ── Général ──────────────────────────────────────────────────────────
      - TZ=${TZ:-Europe/Paris}
    networks:
      - kanissa

networks:
  kanissa:
    external: true
