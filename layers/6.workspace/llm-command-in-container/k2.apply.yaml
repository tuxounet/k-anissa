k2:
  metadata:
    id: k.apps.anissa.layers.workspace.llm-command-in-container
    kind: template-apply
  body:
    template:
      source: inventory
      params:
        id: k.anissa.recettes.docker-compose
    vars:
      name: kanissa-workspace 
      title: Workspace
      description: Workspace conteneurisé - LLM Command with tools and mcp
      composeFile: |
          services:
            kanissa-workspace:
              build: 
                context: .
              container_name: kanissa-workspace
              restart: unless-stopped
              environment:
                - LLM_DEFAULT_MODEL=${LLM_DEFAULT_MODEL:-gemma3}
              networks:
                - anissa
          networks:
            anissa:
              external: true
          