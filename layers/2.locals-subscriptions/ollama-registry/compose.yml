# Ollama avec registry (CPU) — Serveur d'inférence avec pré-chargement
services:
  ollama:
    image: ollama/ollama:latest
    container_name: kanissa-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - "${KANISSA_DATA:-.data}/ollama:/root/.ollama"
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - kanissa

networks:
  kanissa:
    external: true
