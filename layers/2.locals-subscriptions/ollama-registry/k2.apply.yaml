k2:
  metadata:
    id: k.apps.anissa.layers.inferences.local-with-internet-registry
    kind: template-apply
  body:
    template:
      source: inventory
      params:
        id: k.anissa.recettes.docker-compose
    vars:
      name: ollama 
      title: ollama
      description: Workspace conteneurisé — Claude Code AI Agent avec MCP, Tools et LLM Proxy 
      composeFile: |
          # Ollama avec registry (CPU) — Serveur d'inférence avec pré-chargement
          services:
            ollama:
              image: ollama/ollama:latest
              container_name: kanissa-ollama
              restart: unless-stopped
              ports:
                - "${OLLAMA_PORT:-11434}:11434"
              volumes:
                - "${KANISSA_DATA:-.data}/ollama:/root/.ollama"
              environment:
                - OLLAMA_HOST=0.0.0.0
              networks:
                - anissa
          networks:
            anissa:
              external: true
     