# VSCodium (code-server) — IDE Web
services:
  code-server:
    image: linuxserver/code-server:latest
    container_name: kanissa-code-server
    restart: unless-stopped
    ports:
      - "${CODE_SERVER_PORT:-8443}:8443"
    volumes:
      - "${KANISSA_DATA:-.data}/code-server:/config"
      - "${KANISSA_WORKSPACE_DIR:-${KANISSA_DATA:-.data}/workspace}:/workspace"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
      - DEFAULT_WORKSPACE=/workspace
    networks:
      - kanissa

networks:
  kanissa:
    external: true
