# Wetty — Terminal web SSH
services:
  wetty:
    image: wettyoss/wetty:latest
    container_name: kanissa-wetty
    restart: unless-stopped
    ports:
      - "${WETTY_PORT:-3000}:3000"
    command:
      - "--ssh-host=${WETTY_SSH_HOST:-host.docker.internal}"
      - "--ssh-port=${WETTY_SSH_PORT:-22}"
      - "--ssh-user=${WETTY_SSH_USER:-${USER}}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kanissa

networks:
  kanissa:
    external: true
