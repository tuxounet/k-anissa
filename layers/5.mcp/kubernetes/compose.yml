# MCP Kubernetes — Serveur MCP pour les opérations Kubernetes
services:
  mcp-kubernetes:
    image: ghcr.io/strowk/mcp-k8s:latest
    container_name: kanissa-mcp-kubernetes
    restart: unless-stopped
    volumes:
      - "${HOME}/.kube:/root/.kube:ro"
    networks:
      - kanissa

networks:
  kanissa:
    external: true
