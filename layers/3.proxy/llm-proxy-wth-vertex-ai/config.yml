# Configuration LiteLLM — Routage des modèles
# Documentation : https://docs.litellm.ai/docs/proxy/configs
model_list:

  # --- Modèles locaux (Ollama) ---
  - model_name: "local/llama3"
    litellm_params:
      model: "ollama/llama3"
      api_base: "http://kanissa-ollama:11434"

 
  # --- Cloud : Anthropic Claude via Vertex AI (Service Account JSON) ---
  # Uses GOOGLE_APPLICATION_CREDENTIALS (sa.json mounted in the container)
  # along with ANTHROPIC_VERTEX_PROJECT_ID and CLOUD_ML_REGION.
  # Client-facing name is claude-sonnet-4-20250514 (recognized by Claude Code),
  # but LiteLLM routes to Opus 4.6 on the backend.
  - model_name: "claude-sonnet-4-20250514"
    litellm_params:
      model: "vertex_ai/claude-opus-4-6"
      vertex_project: "os.environ/ANTHROPIC_VERTEX_PROJECT_ID"
      vertex_location: "os.environ/CLOUD_ML_REGION"

  # --- Cloud : autres (décommenter selon abonnements) ---
  # - model_name: "cloud/gpt-4"
  #   litellm_params:
  #     model: "azure/gpt-4"
  #     api_key: "os.environ/AZURE_API_KEY"
  #     api_base: "os.environ/AZURE_API_BASE"

general_settings:
  store_model_in_db: false

litellm_settings:
  drop_params: true
  set_verbose: false
