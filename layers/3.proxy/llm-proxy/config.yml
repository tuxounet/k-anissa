# Configuration LiteLLM — Routage des modèles
# Documentation : https://docs.litellm.ai/docs/proxy/configs
model_list:

  # --- Modèles locaux (Ollama) ---
  - model_name: "local/llama3"
    litellm_params:
      model: "ollama/llama3"
      api_base: "http://kanissa-ollama:11434"

 
  # --- Cloud : Anthropic Claude via Vertex AI (GCP API key) ---
  # Requires VERTEX_API_KEY, ANTHROPIC_VERTEX_PROJECT_ID, and CLOUD_ML_REGION
  # set in the root .env file. The "Failed to load vertex credentials" warning
  # is expected when not using ADC — LiteLLM falls back to the api_key.
  - model_name: "claude-sonnet-4-20250514"
    litellm_params:
      model: "vertex_ai/claude-sonnet-4-20250514"
      vertex_project: "os.environ/ANTHROPIC_VERTEX_PROJECT_ID"
      vertex_location: "os.environ/CLOUD_ML_REGION"
      api_key: "os.environ/VERTEX_API_KEY"

  # --- Cloud : autres (décommenter selon abonnements) ---
  # - model_name: "cloud/gpt-4"
  #   litellm_params:
  #     model: "azure/gpt-4"
  #     api_key: "os.environ/AZURE_API_KEY"
  #     api_base: "os.environ/AZURE_API_BASE"

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"

litellm_settings:
  drop_params: true
  set_verbose: false
