k2:
  metadata:
    id: k.apps.anissa.layers.proxy.llm-proxy
    kind: template-apply
  body:
    template:
      source: inventory
      params:
        id: k.anissa.recettes.docker-compose
    vars:
      name: litellm
      title: LLMProxy
      description:  
      composeFile: |
         # LiteLLM Proxy — Routeur multi-modèle OpenAI-compatible
          services:
            litellm:
              image: ghcr.io/berriai/litellm:main-latest
           
              restart: unless-stopped
              ports:
                - "${LITELLM_PORT:-4000}:4000"
              volumes:
                - ./config.yml:/app/config.yaml:ro
              command: ["--config", "/app/config.yaml"]
              environment:
                - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-kanissa-dev}
                # ── Google Vertex AI ─────────────────────────────────────────────────
                - CLOUD_ML_REGION=${CLOUD_ML_REGION:-}
                - ANTHROPIC_VERTEX_PROJECT_ID=${ANTHROPIC_VERTEX_PROJECT_ID:-}
                - VERTEX_API_KEY=${VERTEX_API_KEY:-}
          
              depends_on: []
              networks:
                - kanissa

          networks:
            kanissa:
              external: true
