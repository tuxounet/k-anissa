k2:
  metadata:
    id: k.apps.anissa.layers.proxy.llm-proxy-ollama
    kind: template-apply
  body:
    template:
      source: inventory
      params:
        id: k.anissa.recettes.docker-compose
    vars:
      name: kanissa-litellm
      title: LLMProxy
      description: LiteLLM Proxy — Routeur multi-modèle OpenAI-compatible
      accessUrl: "LLM Proxy API=http://localhost:${LITELLM_PORT:-4000}"
      composeFile: |
          # LiteLLM Proxy — Routeur multi-modèle OpenAI-compatible
          services:
            kanissa-litellm:
              image: ghcr.io/berriai/litellm:main-latest
              restart: unless-stopped
              ports:
                - "${LITELLM_PORT:-4000}:4000"
              volumes:
                - ./config.yml:/app/config.yaml:ro
              command: ["--config", "/app/config.yaml"]
              container_name: kanissa-litellm
              networks:
                - anissa
          networks:
            anissa:
              external: true
