k2:
  metadata:
    id: k.apps.anissa.layers.integrations.open-code-vertex-ai
    kind: template-apply
  body:
    template:
      source: inventory
      params:
        id: k.anissa.recettes.ansible-playbook
    vars:
      name: open-code-vertex-ai
      title: OpenCode Vertex AI
      description: Installe OpenCode (opencode.ai) et le configure pour utiliser Vertex AI directement (Google SA JSON) comme fournisseur LLM via SSH sur le workspace
      accessUrl: ""
      inventoryContent: |
        [workspace]
        kanissa-ws ansible_host=localhost ansible_port=2222
      playbookUp: |
        ---
        - name: "OpenCode Vertex AI — install & configure"
          hosts: workspace
          gather_facts: false
          become: false
          vars:
            opencode_bin: "$HOME/.opencode/bin/opencode"
            cloud_ml_region: "{{ lookup('env', 'CLOUD_ML_REGION') | default('europe-west1', true) }}"
            vertex_project_id: "{{ lookup('env', 'ANTHROPIC_VERTEX_PROJECT_ID') }}"
            opencode_model: "{{ lookup('env', 'DEFAULT_MODEL') | default('claude-sonnet-4-20250514', true) }}"
            sa_json_source: "{{ lookup('env', 'KANISSA_DATA') }}/google-sa-json/sa.json"
            sa_json_dest: "$HOME/.config/gcloud/sa.json"
            opencode_config_dir: "$HOME/.config/opencode"
            opencode_config_file: "$HOME/.config/opencode/opencode.json"
          tasks:
            - name: Check if opencode is already installed
              ansible.builtin.stat:
                path: "{{ opencode_bin }}"
              register: opencode_stat

            - name: Install opencode via official script
              ansible.builtin.shell: |
                curl -fsSL https://opencode.ai/install | bash
              when: not opencode_stat.stat.exists
              register: opencode_install

            - name: Show install output
              ansible.builtin.debug:
                var: opencode_install.stdout_lines
              when: opencode_install is changed

            - name: Verify opencode installation
              ansible.builtin.command: "{{ opencode_bin }} version"
              register: opencode_version
              changed_when: false

            - name: Display opencode version
              ansible.builtin.debug:
                var: opencode_version.stdout_lines

            - name: Create gcloud config directory
              ansible.builtin.file:
                path: "$HOME/.config/gcloud"
                state: directory
                mode: "0755"

            - name: Copy Google SA JSON credentials to workspace
              ansible.builtin.copy:
                src: "{{ sa_json_source }}"
                dest: "{{ sa_json_dest }}"
                mode: "0600"

            - name: Set GOOGLE_APPLICATION_CREDENTIALS in shell profile
              ansible.builtin.lineinfile:
                path: "$HOME/.bashrc"
                line: 'export GOOGLE_APPLICATION_CREDENTIALS="{{ sa_json_dest }}"'
                regexp: '^export GOOGLE_APPLICATION_CREDENTIALS='
                state: present

            - name: Create opencode config directory
              ansible.builtin.file:
                path: "{{ opencode_config_dir }}"
                state: directory
                mode: "0755"

            - name: Write opencode.json configuration
              ansible.builtin.copy:
                dest: "{{ opencode_config_file }}"
                mode: "0644"
                content: |
                  {
                    "$schema": "https://opencode.ai/config.json",
                    "provider": {
                      "vertex-ai": {
                        "npm": "@ai-sdk/google-vertex",
                        "name": "Google Vertex AI",
                        "options": {
                          "project": "{{ vertex_project_id }}",
                          "location": "{{ cloud_ml_region }}"
                        },
                        "models": {
                          "{{ opencode_model }}": {
                            "name": "{{ opencode_model }}"
                          }
                        }
                      }
                    },
                    "model": "vertex-ai/{{ opencode_model }}"
                  }

            - name: Display written configuration
              ansible.builtin.command: cat {{ opencode_config_file }}
              register: config_content
              changed_when: false

            - name: Show config
              ansible.builtin.debug:
                var: config_content.stdout_lines
      playbookDown: |
        ---
        - name: "OpenCode Vertex AI — remove"
          hosts: workspace
          gather_facts: false
          become: false
          vars:
            opencode_dir: "$HOME/.opencode"
            opencode_config_file: "$HOME/.config/opencode/opencode.json"
            sa_json_dest: "$HOME/.config/gcloud/sa.json"
          tasks:
            - name: Check if opencode config exists
              ansible.builtin.stat:
                path: "{{ opencode_config_file }}"
              register: config_stat

            - name: Remove opencode vertex-ai configuration
              ansible.builtin.file:
                path: "{{ opencode_config_file }}"
                state: absent
              when: config_stat.stat.exists

            - name: Remove SA JSON credentials from workspace
              ansible.builtin.file:
                path: "{{ sa_json_dest }}"
                state: absent

            - name: Remove GOOGLE_APPLICATION_CREDENTIALS from shell profile
              ansible.builtin.lineinfile:
                path: "$HOME/.bashrc"
                regexp: '^export GOOGLE_APPLICATION_CREDENTIALS='
                state: absent

            - name: Check if opencode directory exists
              ansible.builtin.stat:
                path: "{{ opencode_dir }}"
              register: opencode_dir_stat

            - name: Remove opencode directory
              ansible.builtin.file:
                path: "{{ opencode_dir }}"
                state: absent
              when: opencode_dir_stat.stat.exists

            - name: Display removal status
              ansible.builtin.debug:
                msg: "OpenCode, Vertex AI configuration and SA credentials removed."
      extraVars: ""

    scripts:
      pre: []
      nuke: []
