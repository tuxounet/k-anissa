k2:
  metadata:
    id: k.apps.anissa.layers.integrations.open-code-ollama
    kind: template-apply
  body:
    template:
      source: inventory
      params:
        id: k.anissa.recettes.ansible-playbook
    vars:
      name: open-code-ollama
      title: OpenCode Ollama
      description: Installe OpenCode (opencode.ai) et le configure pour utiliser le registre Ollama local comme fournisseur LLM via SSH sur le workspace
      accessUrl: ""
      inventoryContent: |
        [workspace]
        kanissa-ws ansible_host=localhost ansible_port=2222
      playbookUp: |
        ---
        - name: "OpenCode Ollama — install & configure"
          hosts: workspace
          gather_facts: false
          become: false
          vars:
            opencode_bin: "$HOME/.opencode/bin/opencode"
            ollama_base_url: "{{ lookup('env', 'OLLAMA_BASE_URL') | default('http://kanissa-ollama:' ~ (lookup('env', 'OLLAMA_PORT') | default('11434', true)) ~ '/v1', true) }}"
            opencode_model: "{{ lookup('env', 'OPENCODE_OLLAMA_MODEL') | default('gemma3:270m', true) }}"
            opencode_config_dir: "$HOME/.config/opencode"
            opencode_config_file: "$HOME/.config/opencode/opencode.json"
            mcp_git_repo: "{{ lookup('env', 'MCP_GIT_REPO') | default('$HOME/repos', true) }}"
          tasks:
            - name: Check if opencode is already installed
              ansible.builtin.stat:
                path: "{{ opencode_bin }}"
              register: opencode_stat

            - name: Install opencode via official script
              ansible.builtin.shell: |
                curl -fsSL https://opencode.ai/install | bash
              when: not opencode_stat.stat.exists
              register: opencode_install

            - name: Show install output
              ansible.builtin.debug:
                var: opencode_install.stdout_lines
              when: opencode_install is changed

            - name: Verify opencode installation
              ansible.builtin.command: "{{ opencode_bin }} version"
              register: opencode_version
              changed_when: false

            - name: Display opencode version
              ansible.builtin.debug:
                var: opencode_version.stdout_lines

            - name: Create opencode config directory
              ansible.builtin.file:
                path: "{{ opencode_config_dir }}"
                state: directory
                mode: "0755"

            - name: Write opencode.json configuration
              ansible.builtin.copy:
                dest: "{{ opencode_config_file }}"
                mode: "0644"
                content: |
                  {
                    "$schema": "https://opencode.ai/config.json",
                    "provider": {
                      "ollama": {
                        "npm": "@ai-sdk/openai-compatible",
                        "name": "Ollama",
                        "options": {
                          "baseURL": "{{ ollama_base_url }}"
                        },
                        "models": {
                          "{{ opencode_model }}": {
                            "name": "{{ opencode_model }}",
                            "options": {
                              "num_ctx": 2048
                            }
                          }
                        }
                      }
                    },
                    "model": "ollama/{{ opencode_model }}",
                    "mcp": {
                      "git": {
                        "type": "local",
                        "command": ["mcp-server-git", "--repository", "{{ mcp_git_repo }}"],
                        "enabled": true
                      }
                    }
                  }

            - name: Display written configuration
              ansible.builtin.command: cat {{ opencode_config_file }}
              register: config_content
              changed_when: false

            - name: Show config
              ansible.builtin.debug:
                var: config_content.stdout_lines
      playbookDown: |
        ---
        - name: "OpenCode Ollama — remove"
          hosts: workspace
          gather_facts: false
          become: false
          vars:
            opencode_dir: "$HOME/.opencode"
            opencode_config_file: "$HOME/.config/opencode/opencode.json"
          tasks:
            - name: Check if opencode config exists
              ansible.builtin.stat:
                path: "{{ opencode_config_file }}"
              register: config_stat

            - name: Remove opencode ollama configuration
              ansible.builtin.file:
                path: "{{ opencode_config_file }}"
                state: absent
              when: config_stat.stat.exists

            - name: Check if opencode directory exists
              ansible.builtin.stat:
                path: "{{ opencode_dir }}"
              register: opencode_dir_stat

            - name: Remove opencode directory
              ansible.builtin.file:
                path: "{{ opencode_dir }}"
                state: absent
              when: opencode_dir_stat.stat.exists

            - name: Display removal status
              ansible.builtin.debug:
                msg: "OpenCode and Ollama configuration removed."
      extraVars: ""

    scripts:
      pre: []
      nuke: []
