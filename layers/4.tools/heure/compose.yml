# Tool "heure" — Micro-service qui retourne l'heure courante (exemple de tool MCP)
services:
  tool-heure:
    image: python:3.12-slim
    container_name: kanissa-tool-heure
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./server.py:/app/server.py:ro
    command: ["python", "server.py"]
    ports:
      - "${TOOL_HEURE_PORT:-9100}:9100"
    networks:
      - kanissa

networks:
  kanissa:
    external: true
