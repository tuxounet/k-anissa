version: v0

stack:
  description: |
    Stack de développement et test "tell me a joke"

  env:
    ANISSA_NETWORK: anissa
    TZ: Europe/Paris

  layers:
    - layer: layers/1.cloud-subscriptions
      plan: google-sa-json

    - layer: layers/6.workspace
      plan: workspace-keypair

    - layer: layers/6.workspace
      plan: ubuntu-workspace

    - layer: layers/7.integrations
      plan: open-code-vertex-ai
      env:
        DEFAULT_MODEL: gemini-2.5-flash 
        CLOUD_ML_REGION : europe-west9

    - layer: layers/8.mcp
      plan: git
      
    - layer: layers/10.clients
      plan: wetty
      env:
        WETTY_PORT: "3000"
