version: v0

stack:
  description: "Stack avec proxy vers Vertex AI (Claude via GCP)"

  env:
    ANISSA_NETWORK: anissa
    TZ: Europe/Paris

  layers:
    - layer: layers/1.cloud-subscriptions
      plan: google-sa-json

    - layer: layers/3.proxy
      plan: llm-proxy-wth-vertex-ai
      env:
        LITELLM_PORT: "4000"
        LITELLM_MASTER_KEY: "sk-anissa-local"

    - layer: layers/6.workspace
      plan: claude-code-in-container
