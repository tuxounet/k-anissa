version: v0

stack:
  description: "Stack de développement et test"

  env:
    ANISSA_NETWORK: anissa
    TZ: Europe/Paris

  layers:
    - layer: layers/2.locals-subscriptions
      plan: ollama-registry
      env:
        OLLAMA_PORT: "11434"

    - layer: layers/3.proxy
      plan: llm-proxy
      env:
        LITELLM_PORT: "4000"
        LITELLM_MASTER_KEY: "sk-anissa-local"

    - layer: layers/6.workspace
      plan: llm-command-in-container
